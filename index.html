<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Locus — Delhi NCR Restaurant Scout</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      overflow: hidden;
    }

    #app { display: flex; height: 100vh; }

    /* ── Sidebar ── */
    #sidebar {
      width: 340px;
      min-width: 340px;
      display: flex;
      flex-direction: column;
      background: #141622;
      border-right: 1px solid #252840;
      overflow: hidden;
      z-index: 1000;
    }

    #header {
      padding: 18px 20px 14px;
      background: #0f1117;
      border-bottom: 1px solid #252840;
      flex-shrink: 0;
    }

    #header h1 {
      font-size: 20px;
      font-weight: 800;
      color: #f7941d;
      letter-spacing: -0.5px;
    }

    #header p {
      font-size: 11px;
      color: #4a5568;
      margin-top: 3px;
      letter-spacing: 0.3px;
    }

    /* ── Controls ── */
    #controls {
      padding: 14px 20px;
      border-bottom: 1px solid #252840;
      background: #0f1117;
      flex-shrink: 0;
    }

    .ctrl-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4a5568;
      margin-bottom: 8px;
      display: block;
    }

    .radius-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    #radius-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 3px;
      background: #252840;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    #radius-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #f7941d;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(247,148,29,0.4);
    }

    #radius-display {
      font-size: 13px;
      font-weight: 700;
      color: #f7941d;
      min-width: 44px;
      text-align: right;
    }

    /* ── Legend ── */
    #legend {
      padding: 10px 20px;
      border-bottom: 1px solid #252840;
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      color: #718096;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Location panel ── */
    #location-panel {
      padding: 12px 20px 14px;
      border-bottom: 1px solid #252840;
      flex-shrink: 0;
    }

    #location-name {
      font-size: 14px;
      font-weight: 600;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #location-coords {
      font-size: 10px;
      color: #4a5568;
      margin-top: 2px;
      font-family: 'SF Mono', 'Fira Code', monospace;
    }

    #rent-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid transparent;
    }

    #rent-badge.high    { background: rgba(229,62,62,0.12); color: #fc8181; border-color: rgba(229,62,62,0.25); }
    #rent-badge.medium  { background: rgba(237,137,54,0.12); color: #f6ad55; border-color: rgba(237,137,54,0.25); }
    #rent-badge.cheap   { background: rgba(72,187,120,0.12); color: #68d391; border-color: rgba(72,187,120,0.25); }
    #rent-badge.unknown { background: rgba(113,128,150,0.12); color: #a0aec0; border-color: rgba(113,128,150,0.25); }

    /* ── Scroll area ── */
    #results-scroll {
      flex: 1;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    #results-scroll::-webkit-scrollbar { width: 3px; }
    #results-scroll::-webkit-scrollbar-track { background: transparent; }
    #results-scroll::-webkit-scrollbar-thumb { background: #252840; border-radius: 2px; }

    /* ── Placeholder ── */
    #placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 14px;
      padding: 40px 28px;
      text-align: center;
      color: #4a5568;
    }

    #placeholder .icon { font-size: 40px; opacity: 0.4; }

    #placeholder p {
      font-size: 13px;
      line-height: 1.6;
      color: #4a5568;
    }

    #placeholder strong { color: #718096; }

    /* ── Loading ── */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
      gap: 12px;
      color: #718096;
      font-size: 12px;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid #252840;
      border-top-color: #f7941d;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Summary pills ── */
    .summary-bar {
      display: flex;
      gap: 6px;
      padding: 12px 16px;
      background: #0f1117;
      border-bottom: 1px solid #252840;
    }

    .summary-pill {
      flex: 1;
      background: #141622;
      border: 1px solid #252840;
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
    }

    .summary-pill .sval {
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
    }

    .summary-pill .slbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #4a5568;
      margin-top: 3px;
    }

    .summary-pill.sp-students .sval { color: #63b3ed; }
    .summary-pill.sp-workers  .sval { color: #b794f4; }
    .summary-pill.sp-transit  .sval { color: #f6ad55; }

    /* ── Score bar ── */
    .score-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background: #0f1117;
      border-bottom: 1px solid #252840;
    }

    .score-label { font-size: 10px; color: #4a5568; text-transform: uppercase; letter-spacing: 0.8px; flex-shrink: 0; }

    .score-track {
      flex: 1;
      height: 5px;
      background: #252840;
      border-radius: 3px;
      overflow: hidden;
    }

    .score-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    .score-val { font-size: 11px; font-weight: 700; flex-shrink: 0; }

    .score-low    .score-fill { background: #fc8181; }
    .score-medium .score-fill { background: #f6ad55; }
    .score-high   .score-fill { background: #68d391; }
    .score-low    .score-val  { color: #fc8181; }
    .score-medium .score-val  { color: #f6ad55; }
    .score-high   .score-val  { color: #68d391; }

    /* ── Category sections ── */
    .cat-section { border-bottom: 1px solid #1a1e2e; }

    .cat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .cat-header:hover { background: #1a1e2e; }

    .cat-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .cs-students  .cat-icon { background: rgba(66,153,225,0.12); }
    .cs-workers   .cat-icon { background: rgba(128,90,213,0.12); }
    .cs-govt      .cat-icon { background: rgba(49,130,206,0.12); }
    .cs-transit   .cat-icon { background: rgba(237,137,54,0.12); }
    .cs-markets   .cat-icon { background: rgba(72,187,120,0.12); }

    .cat-title { flex: 1; font-size: 12px; font-weight: 600; }

    .cat-count {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .cs-students  .cat-count { background: rgba(66,153,225,0.12); color: #63b3ed; }
    .cs-workers   .cat-count { background: rgba(128,90,213,0.12); color: #b794f4; }
    .cs-govt      .cat-count { background: rgba(49,130,206,0.12); color: #76e4f7; }
    .cs-transit   .cat-count { background: rgba(237,137,54,0.12); color: #f6ad55; }
    .cs-markets   .cat-count { background: rgba(72,187,120,0.12); color: #68d391; }

    .cat-chevron { font-size: 10px; color: #4a5568; transition: transform 0.2s; }
    .cat-section.collapsed .cat-chevron { transform: rotate(-90deg); }

    .cat-items { padding: 0 16px 8px; }
    .cat-section.collapsed .cat-items { display: none; }

    .poi-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid #1a1e2e;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .poi-row:last-child { border-bottom: none; }
    .poi-row:hover { opacity: 0.75; }

    .poi-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .poi-info { flex: 1; min-width: 0; }

    .poi-name {
      font-size: 12px;
      color: #cbd5e0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .poi-type {
      font-size: 10px;
      color: #4a5568;
      text-transform: capitalize;
      margin-top: 1px;
    }

    /* ── Error ── */
    .error-msg {
      padding: 24px 20px;
      color: #fc8181;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    .no-results {
      padding: 24px 20px;
      color: #4a5568;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }

    /* ── Search ── */
    #search-section {
      padding: 10px 14px;
      border-bottom: 1px solid #252840;
      background: #0f1117;
      flex-shrink: 0;
      position: relative;
    }

    .search-wrap {
      display: flex;
      align-items: center;
      background: #1a1e2e;
      border: 1px solid #252840;
      border-radius: 8px;
      padding: 0 10px;
      gap: 6px;
      transition: border-color 0.15s;
    }

    .search-wrap:focus-within { border-color: #f7941d; }

    .search-wrap .si { font-size: 13px; color: #4a5568; flex-shrink: 0; }

    #search-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #e2e8f0;
      font-size: 12px;
      padding: 8px 0;
      font-family: inherit;
    }

    #search-input::placeholder { color: #4a5568; }

    #search-clear {
      background: none;
      border: none;
      color: #4a5568;
      cursor: pointer;
      font-size: 12px;
      padding: 2px;
      line-height: 1;
      flex-shrink: 0;
    }

    #search-clear:hover { color: #e2e8f0; }

    #search-dropdown {
      position: absolute;
      top: calc(100% - 2px);
      left: 14px;
      right: 14px;
      background: #1a1e2e;
      border: 1px solid #252840;
      border-top: none;
      border-radius: 0 0 8px 8px;
      z-index: 9999;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .search-item {
      padding: 9px 12px;
      font-size: 12px;
      cursor: pointer;
      border-bottom: 1px solid #1a1e2e;
      color: #cbd5e0;
      line-height: 1.3;
    }

    .search-item:last-child { border-bottom: none; }
    .search-item:hover { background: #252840; color: #f7941d; }

    .search-item .si-name { font-weight: 500; }
    .search-item .si-sub  { font-size: 10px; color: #4a5568; margin-top: 1px; }

    .search-loading {
      padding: 10px 12px;
      font-size: 11px;
      color: #4a5568;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ── City-wide density toggles ── */
    #citywide-section {
      padding: 10px 14px 12px;
      border-bottom: 1px solid #252840;
      flex-shrink: 0;
    }

    .cw-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #4a5568;
      display: block;
      margin-bottom: 8px;
    }

    .toggle-row {
      display: flex;
      gap: 6px;
    }

    .tog-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 7px 4px;
      background: #0f1117;
      border: 1px solid #252840;
      border-radius: 8px;
      cursor: pointer;
      font-size: 11px;
      color: #718096;
      font-family: inherit;
      transition: all 0.15s;
      position: relative;
    }

    .tog-btn:hover { border-color: #4a5568; color: #cbd5e0; }

    .tog-btn.active-colleges { border-color: #63b3ed; color: #63b3ed; background: rgba(66,153,225,0.08); }
    .tog-btn.active-itparks  { border-color: #b794f4; color: #b794f4; background: rgba(128,90,213,0.08); }
    .tog-btn.active-govt     { border-color: #76e4f7; color: #76e4f7; background: rgba(49,130,206,0.08); }

    .tog-icon { font-size: 16px; }
    .tog-label { font-size: 10px; font-weight: 600; letter-spacing: 0.3px; }

    .tog-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: #252840;
      color: #a0aec0;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 8px;
      border: 1px solid #1a1e2e;
      display: none;
    }

    .tog-btn.active-colleges .tog-badge { background: rgba(66,153,225,0.2); color: #63b3ed; display: block; }
    .tog-btn.active-itparks  .tog-badge { background: rgba(128,90,213,0.2); color: #b794f4; display: block; }
    .tog-btn.active-govt     .tog-badge { background: rgba(49,130,206,0.2);  color: #76e4f7; display: block; }

    .tog-spinner {
      width: 10px; height: 10px;
      border: 1.5px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    .tog-btn.loading .tog-spinner { display: inline-block; }
    .tog-btn.loading .tog-icon    { display: none; }

    /* ── Map ── */
    #map { flex: 1; }

    .leaflet-container { background: #141622 !important; }

    .rent-tip {
      background: rgba(15,17,23,0.92) !important;
      border: 1px solid #252840 !important;
      color: #a0aec0 !important;
      font-size: 11px !important;
      border-radius: 6px !important;
      padding: 4px 8px !important;
      box-shadow: none !important;
    }

    .rent-tip::before { display: none; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Sidebar ── -->
  <div id="sidebar">
    <div id="header">
      <h1>Locus</h1>
      <p>Delhi & NCR · Dosa QSR Location Scout</p>
    </div>

    <!-- ── Location search ── -->
    <div id="search-section">
      <div class="search-wrap">
        <span class="si">⌕</span>
        <input type="text" id="search-input" placeholder="Search a location in Delhi…" autocomplete="off" spellcheck="false">
        <button id="search-clear" style="display:none" title="Clear">✕</button>
      </div>
      <div id="search-dropdown" style="display:none"></div>
    </div>

    <div id="controls">
      <span class="ctrl-label">Search Radius</span>
      <div class="radius-row">
        <input type="range" id="radius-slider" min="300" max="5000" step="100" value="1000">
        <span id="radius-display">1 km</span>
      </div>
    </div>

    <!-- ── City-wide density view ── -->
    <div id="citywide-section">
      <span class="cw-label">City-wide Density View</span>
      <div class="toggle-row">
        <button class="tog-btn" id="tog-colleges" data-cat="colleges">
          <span class="tog-spinner"></span>
          <span class="tog-icon">🎓</span>
          <span class="tog-label">Colleges</span>
          <span class="tog-badge" id="badge-colleges">0</span>
        </button>
        <button class="tog-btn" id="tog-itparks" data-cat="itparks">
          <span class="tog-spinner"></span>
          <span class="tog-icon">💼</span>
          <span class="tog-label">IT Parks</span>
          <span class="tog-badge" id="badge-itparks">0</span>
        </button>
        <button class="tog-btn" id="tog-govt" data-cat="govt">
          <span class="tog-spinner"></span>
          <span class="tog-icon">🏛️</span>
          <span class="tog-label">Govt</span>
          <span class="tog-badge" id="badge-govt">0</span>
        </button>
      </div>
    </div>

    <div id="legend">
      <div class="legend-item"><div class="legend-dot" style="background:#e53e3e;opacity:0.7"></div> High rent</div>
      <div class="legend-item"><div class="legend-dot" style="background:#dd6b20;opacity:0.7"></div> Medium</div>
      <div class="legend-item"><div class="legend-dot" style="background:#38a169;opacity:0.7"></div> Affordable</div>
    </div>

    <div id="location-panel" style="display:none">
      <div id="location-name">—</div>
      <div id="location-coords"></div>
      <div id="rent-badge"></div>
    </div>

    <div id="results-scroll">
      <div id="placeholder">
        <div class="icon">📍</div>
        <p>Click anywhere on the map to analyze a location.<br><strong>Adjust the radius</strong> to expand or shrink the search area.</p>
        <p style="margin-top:8px;font-size:11px;">Colored zones show approximate rent levels across Delhi NCR.</p>
      </div>
      <div id="results" style="display:none"></div>
    </div>
  </div>

  <!-- ── Map ── -->
  <div id="map"></div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

// ─────────────────────────────────────────────────────────────────
// HAVERSINE DISTANCE (meters)
// ─────────────────────────────────────────────────────────────────
function haversine(lat1, lng1, lat2, lng2) {
  const R = 6371000;
  const φ1 = lat1 * Math.PI / 180;
  const φ2 = lat2 * Math.PI / 180;
  const Δφ = (lat2 - lat1) * Math.PI / 180;
  const Δλ = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(Δφ/2)**2 + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ─────────────────────────────────────────────────────────────────
// RENT ZONE LOOKUP
// ─────────────────────────────────────────────────────────────────
function getRentZone(lat, lng) {
  // Find all zones that contain this point
  const matches = [];
  for (const z of RENT_ZONES) {
    const d = haversine(lat, lng, z.lat, z.lng);
    if (d <= z.r) matches.push({ ...z, d });
  }

  if (matches.length > 0) {
    // Priority: high > medium > cheap, then by distance
    const priority = { high: 0, medium: 1, cheap: 2 };
    matches.sort((a, b) => priority[a.cat] - priority[b.cat] || a.d - b.d);
    return matches[0];
  }

  // Fall back to nearest zone
  let nearest = null, nearestDist = Infinity;
  for (const z of RENT_ZONES) {
    const d = haversine(lat, lng, z.lat, z.lng);
    if (d < nearestDist) { nearest = z; nearestDist = d; }
  }

  if (nearestDist > 15000) return { name: 'Outside mapped area', cat: 'unknown' };
  return nearest;
}

// ─────────────────────────────────────────────────────────────────
// OVERPASS API QUERY
// ─────────────────────────────────────────────────────────────────
const OVERPASS_ENDPOINTS = [
  'https://overpass-api.de/api/interpreter',
  'https://overpass.kumi.systems/api/interpreter',
  'https://overpass.openstreetmap.ru/api/interpreter',
];

async function fetchPOIs(lat, lng, radius) {
  const ar = `(around:${radius},${lat},${lng})`;
  // Use nwr (node+way+relation) so large campuses, IT parks and
  // metro stations mapped as relations/areas are also returned.
  const query = `
[out:json][timeout:35];
(
  nwr["amenity"~"^(university|college)$"]${ar};
  nwr["building"~"^(university|college)$"]${ar};
  nwr["landuse"="education"]${ar};

  nwr["office"]${ar};
  nwr["building"~"^(office|commercial)$"]${ar};

  nwr["office"="government"]${ar};
  nwr["amenity"~"^(courthouse|townhall|public_building|police|post_office)$"]${ar};
  nwr["government"]${ar};

  nwr["railway"~"^(station|halt)$"]${ar};
  nwr["station"="subway"]${ar};
  nwr["public_transport"~"^(station|stop_area)$"]${ar};
  nwr["amenity"="bus_station"]${ar};
  node["highway"="bus_stop"]["name"]${ar};

  nwr["amenity"="marketplace"]${ar};
  nwr["shop"~"^(mall|department_store|supermarket)$"]${ar};
  nwr["building"~"^(mall|retail|supermarket)$"]${ar};
  nwr["landuse"="retail"]${ar};
);
out center;
  `.trim();

  let lastErr;
  for (const endpoint of OVERPASS_ENDPOINTS) {
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
      });
      if (!res.ok) { lastErr = new Error(`HTTP ${res.status} from ${endpoint}`); continue; }
      const data = await res.json();
      console.log(`[Locus] ${data.elements.length} raw elements from ${endpoint}`);
      data.elements.slice(0, 30).forEach(e => {
        const t = e.tags || {};
        console.log(t.name || '(unnamed)', '→ cat:', classify(e),
          '| tags:', JSON.stringify({amenity:t.amenity, office:t.office, building:t.building,
          railway:t.railway, station:t.station, shop:t.shop, landuse:t.landuse, highway:t.highway}));
      });
      return data;
    } catch (err) {
      console.warn(`[Locus] ${endpoint} failed:`, err.message);
      lastErr = err;
    }
  }
  throw lastErr || new Error('All Overpass endpoints failed');
}

// ─────────────────────────────────────────────────────────────────
// CLASSIFY ELEMENT
// ─────────────────────────────────────────────────────────────────
function classify(el) {
  const t = el.tags || {};

  // Students
  if (t.amenity === 'university' || t.amenity === 'college') return 'students';
  if (t.building === 'university' || t.building === 'college') return 'students';
  if (t.landuse === 'education') return 'students';

  // Government (check before generic office so govt offices are correctly binned)
  if (t.office === 'government' || t.government) return 'govt';
  if (t.amenity === 'courthouse' || t.amenity === 'townhall' ||
      t.amenity === 'public_building' || t.amenity === 'police' ||
      t.amenity === 'post_office') return 'govt';

  // Private offices / IT (any office= tag that isn't government)
  if (t.office) return 'workers';
  if (t.building === 'office' || t.building === 'commercial') return 'workers';

  // Transit
  if (t.railway === 'station' || t.railway === 'halt') return 'transit';
  if (t.station === 'subway') return 'transit';
  if (t.public_transport === 'station' || t.public_transport === 'stop_area') return 'transit';
  if (t.amenity === 'bus_station' || t.highway === 'bus_stop') return 'transit';

  // Markets & malls
  if (t.amenity === 'marketplace') return 'markets';
  if (t.shop === 'mall' || t.shop === 'department_store' || t.shop === 'supermarket') return 'markets';
  if (t.building === 'mall' || t.building === 'retail' || t.building === 'supermarket') return 'markets';
  if (t.landuse === 'retail') return 'markets';

  return null;
}

function getCoords(el) {
  if (el.type === 'node') return [el.lat, el.lon];
  if (el.center) return [el.center.lat, el.center.lon];
  return null;
}

function getName(el) {
  const t = el.tags || {};
  return t.name || t['name:en'] || t['name:hi'] || t.operator || null;
}

function getSubtype(el) {
  const t = el.tags || {};
  if (t.office)        return t.office.replace(/_/g, ' ');
  if (t.amenity)       return t.amenity.replace(/_/g, ' ');
  if (t.railway)       return t.railway.replace(/_/g, ' ');
  if (t.station)       return t.station.replace(/_/g, ' ');
  if (t.public_transport) return t.public_transport.replace(/_/g, ' ');
  if (t.shop)          return t.shop.replace(/_/g, ' ');
  if (t.building)      return t.building.replace(/_/g, ' ');
  if (t.landuse)       return t.landuse.replace(/_/g, ' ');
  if (t.highway)       return 'bus stop';
  return '';
}

// ─────────────────────────────────────────────────────────────────
// FOOTFALL SCORE (0–100)
// ─────────────────────────────────────────────────────────────────
function calcScore(grouped) {
  const students  = (grouped.students || []).length;
  const workers   = (grouped.workers  || []).length + (grouped.govt || []).length;
  const transit   = (grouped.transit  || []).length;
  const markets   = (grouped.markets  || []).length;

  // Score each factor 0–33
  const sScore = Math.min(33, students * 8);
  const wScore = Math.min(33, workers  * 3);
  const tScore = Math.min(22, transit  * 7);
  const mScore = Math.min(12, markets  * 4);

  return Math.round(sScore + wScore + tScore + mScore);
}

function renderResults(grouped) {
  clearPoiLayers();
  const resultsDiv = document.getElementById('results');

  const nStudents = (grouped.students || []).length;
  const nWorkers  = (grouped.workers  || []).length + (grouped.govt || []).length;
  const nTransit  = (grouped.transit  || []).length;
  const score     = calcScore(grouped);

  const scoreCls = score >= 60 ? 'score-high' : score >= 30 ? 'score-medium' : 'score-low';
  const scoreTxt = score >= 60 ? 'Strong' : score >= 30 ? 'Moderate' : 'Low';

  let html = `
    <div class="summary-bar">
      <div class="summary-pill sp-students">
        <div class="sval">${nStudents}</div>
        <div class="slbl">Colleges</div>
      </div>
      <div class="summary-pill sp-workers">
        <div class="sval">${nWorkers}</div>
        <div class="slbl">Offices</div>
      </div>
      <div class="summary-pill sp-transit">
        <div class="sval">${nTransit}</div>
        <div class="slbl">Transit</div>
      </div>
    </div>
    <div class="score-bar ${scoreCls}">
      <div class="score-label">Footfall Score</div>
      <div class="score-track">
        <div class="score-fill" style="width:${score}%"></div>
      </div>
      <div class="score-val">${score}/100 · ${scoreTxt}</div>
    </div>
  `;

  let anyResults = false;

  for (const [key, cfg] of Object.entries(CATS)) {
    const items = grouped[key] || [];
    if (items.length === 0) continue;
    anyResults = true;

    html += `
      <div class="cat-section ${cfg.cls}">
        <div class="cat-header" onclick="toggleSection(this)">
          <div class="cat-icon">${cfg.icon}</div>
          <div class="cat-title">${cfg.label}</div>
          <div class="cat-count">${items.length}</div>
          <div class="cat-chevron">▾</div>
        </div>
        <div class="cat-items">
          ${items.map((item, idx) => `
            <div class="poi-row" data-lat="${item.lat}" data-lng="${item.lng}">
              <div class="poi-dot" style="background:${cfg.color}"></div>
              <div class="poi-info">
                <div class="poi-name">${item.name || 'Unnamed'}</div>
                <div class="poi-type">${item.subtype || key}</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;

    // Map markers
    items.forEach(item => {
      if (!item.lat) return;
      const m = L.circleMarker([item.lat, item.lng], {
        radius: 5,
        color: cfg.color,
        fillColor: cfg.color,
        fillOpacity: 0.85,
        weight: 1.5,
      }).bindPopup(`<strong>${item.name || 'Unnamed'}</strong><br><em>${cfg.label}</em>`).addTo(map);
      poiLayers.push(m);
    });
  }

  if (!anyResults) {
    html += `<div class="no-results">No key locations found within this radius.<br>Try increasing the radius or picking a different spot.</div>`;
  }

  resultsDiv.innerHTML = html;

  // POI row click → fly to
  resultsDiv.querySelectorAll('.poi-row[data-lat]').forEach(row => {
    row.addEventListener('click', () => {
      const lat = parseFloat(row.dataset.lat);
      const lng = parseFloat(row.dataset.lng);
      if (!isNaN(lat)) map.flyTo([lat, lng], 16, { duration: 0.8 });
    });
  });
}

  headerEl.closest('.cat-section').classList.toggle('collapsed');
}

// ─────────────────────────────────────────────────────────────────
// MAIN QUERY + RENDER
// ─────────────────────────────────────────────────────────────────
async function queryAndRender(lat, lng, radius) {
  const resultsDiv  = document.getElementById('results');
  const placeholder = document.getElementById('placeholder');
  const locPanel    = document.getElementById('location-panel');

  // Show location panel
  const zone = getRentZone(lat, lng);
  document.getElementById('location-name').textContent = zone.name || 'Unknown Area';
  document.getElementById('location-coords').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
  const badge = document.getElementById('rent-badge');
  badge.className = zone.cat || 'unknown';
  badge.textContent = ZONE_LABELS[zone.cat] || '⬜ Unknown Area';
  locPanel.style.display = 'block';

  // Show loading
  placeholder.style.display = 'none';
  resultsDiv.style.display = 'block';
  resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Scanning nearby locations…</div>';
  clearPoiLayers();

  try {
    const data = await fetchPOIs(lat, lng, radius);
    const grouped = {};
    const seen = new Set();

    for (const el of data.elements) {
      const id = `${el.type}-${el.id}`;
      if (seen.has(id)) continue;
      seen.add(id);

      const coords = getCoords(el);
      if (!coords) continue;

      const cat = classify(el);
      if (!cat) continue;

      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push({
        name:    getName(el),
        subtype: getSubtype(el),
        lat:     coords[0],
        lng:     coords[1],
      });
    }

    renderResults(grouped);
  } catch (err) {
    resultsDiv.innerHTML = `<div class="error-msg">Failed to fetch data.<br>Check your internet connection and try again.<br><small style="opacity:0.5">${err.message}</small></div>`;
  }
}

// LOCATION SEARCH  (Nominatim geocoding)
// ─────────────────────────────────────────────────────────────────
const searchInput    = document.getElementById('search-input');
const searchClear    = document.getElementById('search-clear');
const searchDropdown = document.getElementById('search-dropdown');
let searchTimer = null;

searchInput.addEventListener('input', () => {
  const q = searchInput.value.trim();
  searchClear.style.display = q ? 'block' : 'none';
  clearTimeout(searchTimer);
  if (q.length < 2) { hideDropdown(); return; }
  searchTimer = setTimeout(() => geocode(q), 400);
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchClear.style.display = 'none';
  hideDropdown();
  searchInput.focus();
});

// Close dropdown when clicking outside
document.addEventListener('click', e => {
  if (!e.target.closest('#search-section')) hideDropdown();
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideDropdown(); searchInput.blur(); }
  if (e.key === 'Enter') {
    const first = searchDropdown.querySelector('.search-item');
    if (first) first.click();
  }
});

function hideDropdown() {
  searchDropdown.style.display = 'none';
  searchDropdown.innerHTML = '';
}

async function geocode(q) {
  searchDropdown.innerHTML = '<div class="search-loading"><div class="spinner" style="width:12px;height:12px;border-width:1.5px"></div> Searching…</div>';
  searchDropdown.style.display = 'block';

  try {
    const url = `https://nominatim.openstreetmap.org/search?` +
      `q=${encodeURIComponent(q + ' Delhi')}&format=json&limit=6&countrycodes=in` +
      `&viewbox=76.60,29.00,77.70,28.20&bounded=0&addressdetails=1`;
    const res  = await fetch(url, { headers: { 'Accept-Language': 'en' } });
    const data = await res.json();

    if (!data.length) {
      searchDropdown.innerHTML = '<div class="search-loading">No results found</div>';
      return;
    }

    searchDropdown.innerHTML = data.map(r => {
      const parts = [r.address?.suburb, r.address?.city_district, r.address?.state_district]
        .filter(Boolean).join(', ');
      return `<div class="search-item" data-lat="${r.lat}" data-lng="${r.lon}">
        <div class="si-name">${r.display_name.split(',')[0]}</div>
        <div class="si-sub">${parts || r.display_name.split(',').slice(1,3).join(',').trim()}</div>
      </div>`;
    }).join('');

    searchDropdown.querySelectorAll('.search-item').forEach(item => {
      item.addEventListener('click', () => {
        const lat = parseFloat(item.dataset.lat);
        const lng = parseFloat(item.dataset.lng);
        searchInput.value = item.querySelector('.si-name').textContent;
        searchClear.style.display = 'block';
        hideDropdown();
        map.flyTo([lat, lng], 14, { duration: 0.8 });
        // Drop pin and run analysis after fly animation settles
        setTimeout(() => {
          if (currentMarker) map.removeLayer(currentMarker);
          currentMarker = L.marker([lat, lng], { icon: PIN_ICON }).addTo(map);
          redrawCircle({ lat, lng });
          queryAndRender(lat, lng, currentRadius);
        }, 900);
      });
    });
  } catch (err) {
    searchDropdown.innerHTML = '<div class="search-loading">Search failed — check connection</div>';
  }
}

    label:  'College / University',
    activeClass: 'active-colleges',
    query: `
[out:json][timeout:55];
(

  nwr["building"~"^(university|college)$"]["name"](${NCR_BBOX});

);
out center;`.trim(),
  },
  itparks: {

    label:  'IT / Tech Office',
    activeClass: 'active-itparks',
    query: `
[out:json][timeout:55];
(

// Per-category state
const cwState = { colleges: false, itparks: false, govt: false };
const cwLayers = { colleges: [], itparks: [], govt: [] };
const cwFetched = { colleges: null, itparks: null, govt: null }; // cache

document.querySelectorAll('.tog-btn').forEach(btn => {
  btn.addEventListener('click', () => toggleCitywide(btn.dataset.cat));
});

async function toggleCitywide(cat) {
  const btn = document.getElementById(`tog-${cat}`);
  const cfg = CW_CONFIG[cat];

  if (cwState[cat]) {
    // Turn OFF — remove layers
    cwLayers[cat].forEach(l => map.removeLayer(l));
    cwLayers[cat] = [];
    cwState[cat] = false;
    btn.classList.remove(cfg.activeClass);
    return;
  }

  // Turn ON
  cwState[cat] = true;
  btn.classList.add(cfg.activeClass);

  if (cwFetched[cat]) {
    // Already fetched — just re-draw
    drawCwLayers(cat, cwFetched[cat]);
    return;
  }

  // Fetch from Overpass
  btn.classList.add('loading');
  try {
    let data = null;
    for (const endpoint of OVERPASS_ENDPOINTS) {
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          body: 'data=' + encodeURIComponent(cfg.query),
        });
        if (!res.ok) continue;
        data = await res.json();
        break;
      } catch { continue; }
    }
    if (!data) throw new Error('All endpoints failed');

    // De-dup by id
    const seen = new Set();
    const items = [];
    for (const el of data.elements) {
      const id = `${el.type}-${el.id}`;
      if (seen.has(id)) continue;
      seen.add(id);
      const coords = getCoords(el);
      const name   = getName(el);
      if (!coords || !name) continue;
      items.push({ coords, name, subtype: getSubtype(el) });
    }

    cwFetched[cat] = items;
    console.log(`[Locus] city-wide ${cat}: ${items.length} places`);

    // Update badge
    document.getElementById(`badge-${cat}`).textContent = items.length;
    drawCwLayers(cat, items);
  } catch (err) {
    console.error('[Locus] citywide fetch failed:', err);
    cwState[cat] = false;
    btn.classList.remove(cfg.activeClass);
  } finally {
    btn.classList.remove('loading');
  }
}

function drawCwLayers(cat, items) {
  const cfg = CW_CONFIG[cat];
  cwLayers[cat] = items.map(({ coords, name, subtype }) =>
    L.circleMarker(coords, {
      radius: 5,
      color: cfg.color,
      fillColor: cfg.color,
      fillOpacity: 0.75,
      weight: 1,
      pane: 'overlayPane',
    }).bindPopup(`<strong>${name}</strong><br><em>${cfg.label}${subtype ? ' · ' + subtype : ''}</em>`)
      .addTo(map)
  );
}
